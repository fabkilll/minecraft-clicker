<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Minecraft Clicker</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Minecraft Cookie Clicker</h1>
            <p>Made by fabkill</p>
        </header>
        <main>
            <section class="game">
                <section class="values">
                    <h3>0</h3>
                </section>
                <section class="button-section">
                    <button class="button"></button>
                </section>
            </section>

            <section class="upgrades">
                <button>Rebirth (100)</button>
            </section>
            <section class="clickers">
                <button>+1</button>
                <button>+10</button>
                <button>Rebirth (100)</button>
            </section>
        </main>
        <footer>
            <p>Version: 0.1 Beta</p>
            <p>Made to learn</p>
            <p>Open source!</p>
        </footer>
    </body>
</html>
