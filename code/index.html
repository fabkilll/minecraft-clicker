<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Minecraft Clicker</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Minecraft Cookie Clicker</h1>
            <p>Made by fabkill</p>
        </header>
        <main>
            <section class="game">
                <section class="values">
                    <p class="multiplier">Multiplier: 1x</p>
                    <h3 class="clicks">0</h3>
                </section>
                <section class="button-section">
                    <button class="button"></button>
                </section>
            </section>

            <section class="upgrades">
                <button class="rebirth-button">Rebirth (10.000 Clicks)<br> </button>
            </section>
            <section class="clickers">
                <button class="buy-pickaxe">+1 cps Pickaxe $100</button>
                <button class="buy-drill">+10 cps Drill $1000</button>
                <button class="buy-tnt">+100 cps TNT, $10.000</button>
            </section>
        </main>
        <footer>
            <p>Version: 0.1 Beta</p>
            <p>Made to learn</p>
            <p>Open source!</p>
        </footer>
    </body>
</html>
